services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: realscore
      POSTGRES_USER: realscore
      POSTGRES_PASSWORD: realscore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realscore -d realscore"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: realscore
      DB_USER: realscore
      DB_PASSWORD: realscore
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
