services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: realscore
      POSTGRES_USER: realscore
      POSTGRES_PASSWORD: realscore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realscore -d realscore"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: realscore
      DB_USER: realscore
      DB_PASSWORD: realscore
      SCRAPE_CRON: "0 0 13,21 * * *"
    ports:
      - "8080:8080"
    restart: unless-stopped
    # The JRE image has no curl/wget, so the request goes through bash's /dev/tcp (not CMD-SHELL: /bin/sh is dash).
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8080
          && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3
          && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # One-shot job: creates/updates Metabase's DB roles and its app DB on every `up` (idempotent, see the script).
  metabase-init:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: realscore
      PGPASSWORD: realscore
      PGDATABASE: realscore
      METABASE_RO_PASSWORD: ${METABASE_RO_PASSWORD:?set it in .env, see .env.example}
      METABASE_APP_DB_PASSWORD: ${METABASE_APP_DB_PASSWORD:?set it in .env, see .env.example}
    volumes:
      - ./docker/metabase/init.sql:/init.sql:ro
    command: ["psql", "--no-psqlrc", "--quiet", "--file", "/init.sql"]
    restart: "no"

  metabase:
    image: metabase/metabase:v0.65.2.5
    depends_on:
      metabase-init:
        condition: service_completed_successfully
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_APP_DB_PASSWORD:?set it in .env, see .env.example}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

volumes:
  postgres-data:
