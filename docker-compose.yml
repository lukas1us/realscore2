services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: realscore
      POSTGRES_USER: realscore
      POSTGRES_PASSWORD: realscore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realscore -d realscore"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: realscore
      DB_USER: realscore
      DB_PASSWORD: realscore
      SCRAPE_CRON: "0 0 3 * * *"
    ports:
      - "8080:8080"
    restart: unless-stopped
    # The JRE image has no curl/wget, so the request goes through bash's /dev/tcp (not CMD-SHELL: /bin/sh is dash).
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8080
          && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3
          && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres-data:
