spring.application.name=realscore

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:realscore}
spring.datasource.username=${DB_USER:realscore}
spring.datasource.password=${DB_PASSWORD:realscore}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
